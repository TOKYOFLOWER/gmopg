<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>銀座東京フラワー</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300&family=Noto+Serif+JP:wght@300&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Serif JP', serif;
  background: #faf8f5;
  color: #1a1714;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  font-weight: 300;
}
.card {
  text-align: center;
  max-width: 480px;
}
.brand-mark {
  font-family: 'Cormorant Garamond', serif;
  font-size: 0.7rem;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: #8b1c2b;
  margin-bottom: 8px;
}
.brand-name {
  font-size: 1.4rem;
  letter-spacing: 0.15em;
  margin-bottom: 32px;
}
h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 2rem;
  font-weight: 300;
  letter-spacing: 0.05em;
  color: #4a4540;
}
.message {
  font-size: 0.9rem;
  color: #8a857f;
  margin-top: 16px;
  letter-spacing: 0.05em;
}
.gold-line {
  width: 48px;
  height: 1px;
  background: #b89a5e;
  margin: 24px auto;
}
.contact {
  font-size: 0.8rem;
  color: #8a857f;
  margin-top: 24px;
}
.contact a {
  color: #8b1c2b;
  text-decoration: none;
}
</style>
</head>
<body>
<div class="card">
  <div class="brand-mark">Ginza Tokyo Flower</div>
  <div class="brand-name">銀座東京フラワー</div>
  <h1>Internal Tools</h1>
  <div class="gold-line"></div>
  <div class="message">このページは内部ツールのインデックスです</div>
  <div class="contact">
    お客様は <a href="https://www.tokyoflower.jp">tokyoflower.jp</a> をご覧ください
  </div>
</div>
</body>
</html>
